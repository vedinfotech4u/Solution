<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting • Ved Infotec</title>
  <!-- Instant redirect after a short brand moment -->
  <meta http-equiv="refresh" content="0; url=https://www.vedinfotech.in">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0b1c2f;  /* deep navy tone that pairs with tech logos */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
    }

    /* main card – soft glow, clean border */
    .redirect-card {
      max-width: 580px;
      width: 100%;
      background: rgba(18, 30, 45, 0.95);
      backdrop-filter: blur(2px);
      border-radius: 3rem 1rem 3rem 1rem;
      padding: 3.5rem 2.5rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(255, 255, 255, 0.05),
                  0 0 40px rgba(0, 180, 255, 0.15);
      text-align: center;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* LOGO HOLDER – exactly as requested: the page holds the logo only,
       with minimal supporting text. Logo is prominent. */
    .logo-wrapper {
      margin-bottom: 2rem;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrapper svg {
      width: 220px;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0, 160, 255, 0.3));
      transition: filter 0.2s;
    }

    /* subtle redirect note – fits the "message to visitor" request */
    .redirect-note {
      color: #b0c8e0;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      border: 1px solid rgba(100, 180, 255, 0.2);
      font-weight: 400;
      backdrop-filter: blur(4px);
    }

    .redirect-note span {
      display: inline-block;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .redirect-note .dot {
      width: 8px;
      height: 8px;
      background: #2f9eff;
      border-radius: 50%;
      box-shadow: 0 0 10px #2f9eff;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
      100% { opacity: 0.6; transform: scale(0.96); }
    }

    /* fallback link – visible for accessibility, but the logo is the star */
    .fallback-link {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #7f9bb9;
      text-decoration: none;
      border-bottom: 1px dashed #2f5f8a;
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
      letter-spacing: 0.3px;
    }

    .fallback-link:hover {
      color: #b8d6ff;
      border-bottom-color: #7ab7ff;
    }

    /* small attribution / url text, just enough */
    .domain-hint {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #4d6a86;
      font-weight: 300;
      text-transform: lowercase;
      letter-spacing: 0.8px;
    }

    /* on small screens, adjust padding */
    @media (max-width: 480px) {
      .redirect-card {
        padding: 2.5rem 1.5rem;
        border-radius: 2rem 0.8rem 2rem 0.8rem;
      }
      .logo-wrapper svg {
        width: 170px;
      }
      .redirect-note {
        font-size: 1rem;
        padding: 0.5rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <!-- LOGO – held at the page, no distraction. This is the Ved Infotec mark. -->
    <div class="logo-wrapper">
      <svg viewBox="0 0 400 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ved Infotec logo">
        <!-- stylized V + tech element, clean and modern -->
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2F9EFF" />
            <stop offset="60%" stop-color="#7A5CFF" />
            <stop offset="100%" stop-color="#00D4FF" />
          </linearGradient>
          <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8AB8FF" />
            <stop offset="100%" stop-color="#C7E0FF" />
          </linearGradient>
        </defs>

        <!-- left: V symbol / abstract wave -->
        <path d="M52 30 L78 82 L104 30" stroke="url(#grad1)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="78" cy="82" r="7" fill="#2F9EFF" opacity="0.9" />
        
        <!-- main text 'ved' -->
        <text x="130" y="70" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="52" fill="url(#grad2)" letter-spacing="-0.5">ved</text>
        
        <!-- 'infotec' smaller & spaced -->
        <text x="228" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="25" fill="#B8D6FF" letter-spacing="1.8">infotec</text>
        
        <!-- subtle tech dot / accent -->
        <circle cx="350" cy="48" r="5" fill="#00D4FF" opacity="0.9" />
        <circle cx="366" cy="48" r="3" fill="#7A5CFF" opacity="0.7" />
      </svg>
    </div>

    <!-- the gentle redirect message to the visitor -->
    <div class="redirect-note">
      <span class="dot"></span>
      <span>redirecting to&nbsp;<strong>www.vedinfotec.in</strong></span>
    </div>

    <!-- accessible fallback link – always available, but not intrusive -->
    <a href="https://www.vedinfotec.in" class="fallback-link" target="_blank" rel="noopener">click here if you are not redirected</a>
    <div class="domain-hint">vedinfotec.in</div>
  </div>

  <!-- extra safety: JavaScript redirect for browsers that ignore meta refresh -->
  <script>
    (function() {
      // primary redirect — same as meta refresh but more robust
      window.location.replace("https://www.vedinfotec.in");
    })();
  </script>
</body>
</html>
